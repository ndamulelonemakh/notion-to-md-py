[project]
name = "notion-to-md-py"
version = "0.1.0"
description = "A package to convert Notion content into Markdown format"
authors = [{ name = "Wei Xiang", email = "xiangweiqaz@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = [
    "notion",
    "markdown",
    "converter",
    "notion-api",
    "notion-client",
    "notion-py",
    "notion-sdk",
    "python",
]
requires-python = ">=3.11, <4.0"
dependencies = ["httpx (>=0.28.1,<0.29.0)", "notion-client (>=2.3.0,<3.0.0)", "asyncio (>=3.4.3,<4.0.0)"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^6.0.0"
pytest-asyncio = "^0.25.3"
tox = "^4.24.1"

